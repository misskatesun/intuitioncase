<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">個案解讀和療癒建議 by 凱特</title>
    
    <!-- 第三方庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    
    <style>
        :root {
            --primary: #7a5c53; 
            --secondary: #c49a6c; 
            --bg: #faf6f0;
            --card-bg: #fff; 
            --text: #3d3531; 
            --clean-btn: #8c5d49; 
            --download-btn: #2e6b4d;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Noto Sans TC", sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            line-height: 1.6; 
        }
        
        .container { 
            max-width: 1050px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr 1.1fr; 
            gap: 25px; 
        }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
        
        .panel { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 14px; 
            box-shadow: 0 4px 20px rgba(122,92,83,.08); 
            border: 1px solid #ebdcd0; 
        }
        h1, h2, h3 { color: var(--primary); margin-top: 0; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--primary); font-size: 14.5px; }
        input[type="text"], input[type="date"], textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #dcd0c7; 
            border-radius: 8px; 
            font-size: 14px; 
            background: #fcfaf8; 
            color: var(--text); 
            outline: 0; 
            font-family: inherit;
        }
        input:focus, textarea:focus { border-color: var(--secondary); background: #fff; }
        textarea { height: 90px; resize: vertical; }

        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }

        .upload-status { font-size: 12.5px; color: var(--primary); margin-top: 4px; font-weight: 500; }
        .preview-box { margin-top: 6px; text-align: center; }
        .preview-box img { max-width: 180px; max-height: 180px; border-radius: 6px; border: 1px solid #ebdcd0; }

        .btn-main { 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            padding: 12px 16px; 
            font-size: 14.5px; 
            font-weight: 600; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 2px 6px rgba(122,92,83,.15); 
            transition: .2s; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
        }
        .btn-main:hover { background: #654a42; transform: translateY(-1px); }
        
        .action-card { 
            background: #fdfaf7; 
            border: 1px solid #eee1d8; 
            border-radius: 10px; 
            padding: 14px 16px; 
            margin-top: 15px; 
        }
        .action-card-title { font-size: 13.5px; font-weight: 700; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 500px) { .btn-grid-2 { grid-template-columns: 1fr; } }
        
        .btn-copy { background: var(--secondary); } .btn-copy:hover { background: #b08759; }
        .btn-print { background: #537367; } .btn-print:hover { background: #425e53; }
        .btn-cards { background: #8c5d49; } .btn-cards:hover { background: #734837; }
        .btn-audio { background: #2e6b4d; } .btn-audio:hover { background: #1f4f37; }

        /* 報告預覽風格 */
        .report-preview-wrapper { background: #fcfaf7; padding: 2px; border-radius: 12px; border: 1px solid #e8dbd0; }
        .report-preview { background: #fff; padding: 30px 25px; border-radius: 10px; font-size: 14px; line-height: 1.6; color: #333; box-shadow: 0 2px 12px rgba(0,0,0,.03); }
        
        .report-header-box { text-align: center; padding-bottom: 10px; margin-bottom: 15px; }
        .report-header-box h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 2px; color: var(--primary); font-weight: 700; }
        .report-meta { font-size: 13.5px; color: #776860; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px 20px; margin-top: 6px; }
        
        .top-image-section { margin: 15px 0 20px 0; text-align: center; }
        .top-image-title { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .top-image-section img { max-width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; border: 1px solid #e8dbd0; }

        .report-section { margin-bottom: 16px; }
        .section-header-block, .first-page-header-block { break-inside: avoid; page-break-inside: avoid; }
        .section-title-bar { 
            font-size: 14.5px; 
            font-weight: 700; 
            color: #fff; 
            background: linear-gradient(135deg, #7a5c53, #947167); 
            padding: 6px 14px; 
            border-radius: 6px; 
            margin-bottom: 10px; 
            letter-spacing: 1px; 
            display: inline-block; 
            break-after: avoid; 
            page-break-after: avoid; 
        }
        
        .item-card { 
            background: #fdfbf9; 
            border: 1px solid #f0e4db; 
            border-left: 4px solid var(--secondary); 
            border-radius: 8px; 
            padding: 12px 15px; 
            margin-bottom: 10px; 
            break-inside: avoid; 
            page-break-inside: avoid; 
            white-space: pre-line;
        }

        .method-box { 
            background: #fcf8f5; 
            border: 1px dashed #d8c4b6; 
            border-radius: 10px; 
            padding: 14px 16px; 
            margin: 12px 0 15px; 
            font-size: 13.5px; 
            line-height: 1.6; 
            color: #4a3d37; 
            break-inside: avoid; 
            page-break-inside: avoid; 
        }
        .method-box h3 { font-size: 15px; color: #7a5c53; margin-bottom: 8px; border-bottom: 1px solid #ebdcd0; padding-bottom: 4px; }
        .method-section { margin-bottom: 8px; } 
        .method-section:last-child { margin-bottom: 0; }
        .method-section strong { color: #8c5d49; }

        .report-footer-box { 
            text-align: center; 
            margin-top: 15px; 
            padding-top: 10px; 
            font-size: 14px; 
            font-weight: 700; 
            color: #654a42; 
            letter-spacing: 0.5px; 
            line-height: 1.5; 
            break-inside: avoid; 
            page-break-inside: avoid; 
        }
        .social-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 8px 0 4px; }
        .social-links { display: flex; justify-content: center; align-items: center; gap: 12px; padding-top: 2px; flex-wrap: wrap; }
        .social-icon-link { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #f0e4db; color: var(--primary); transition: .2s; text-decoration: none; }
        .social-icon-link:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }
        .social-icon-link svg { width: 18px; height: 18px; fill: currentColor; }
        .print-url { display: none; font-size: 11px; color: #555; font-weight: 400; }

        #card-canvas { display: none; }

        @media print {
            @page { size: A4; margin: 10mm 10mm; }
            body { background: #fff !important; padding: 0 !important; color: #2b231f !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .container { display: block !important; width: 100% !important; max-width: 100% !important; }
            .panel:first-child, .action-card { display: none !important; }
            .panel, .report-preview-wrapper, .report-preview { border: none !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
            .report-header-box { page-break-after: avoid !important; break-after: avoid !important; padding-bottom: 6px !important; margin-bottom: 10px !important; }
            .report-header-box h2 { font-size: 18pt !important; color: #6b4d44 !important; }
            .report-section { margin-bottom: 10pt !important; }
            .section-header-block, .first-page-header-block { page-break-inside: avoid !important; break-inside: avoid !important; }
            .section-title-bar { background: #6b4d44 !important; color: #fff !important; font-size: 11pt !important; padding: 4px 10px !important; page-break-after: avoid !important; break-after: avoid !important; }
            .item-card { background: #faf6f2 !important; border: 1px solid #e6d8ce !important; border-left: 5px solid #b88e5d !important; padding: 6pt 8pt !important; margin-bottom: 6pt !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            .method-box { background: #fbf8f5 !important; border: 1px dashed #c8b4a6 !important; padding: 8pt 10pt !important; margin: 8pt 0 !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            .report-footer-box { font-size: 10.5pt !important; font-weight: 700 !important; color: #523b34 !important; margin-top: 10pt !important; padding-top: 5pt !important; page-break-inside: avoid !important; break-inside: avoid !important; }
            a { color: #1b6341 !important; text-decoration: underline !important; }
            .social-title { font-size: 9.5pt !important; margin: 5px 0 2px !important; }
            .social-links { flex-direction: column !important; align-items: center !important; gap: 2px !important; }
            .social-icon-link { background: transparent !important; border: none !important; width: auto !important; height: auto !important; border-radius: 0 !important; display: flex !important; gap: 4px !important; }
            .print-url { display: inline-block !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左側：資料輸入面板 -->
    <div class="panel">
        <h2>個案解讀和療癒建議</h2>
        
        <div class="row">
            <div class="form-group">
                <label>個案姓名</label>
                <input type="text" id="clientName" placeholder="例如：小明" oninput="updatePageTitle()">
            </div>
            <div class="form-group">
                <label>解讀者</label>
                <input type="text" id="readerName" value="凱特">
            </div>
            <div class="form-group">
                <label>解讀日期</label>
                <input type="date" id="readDate">
            </div>
        </div>

        <div class="form-group">
            <label>解讀主題</label>
            <input type="text" id="readTopic" placeholder="例如：近期事業發展與能量狀態對齊">
        </div>

        <div class="form-group">
            <label>上傳牌陣照片（支援 JPG, PNG, HEIC）</label>
            <input type="file" id="spreadImage" accept="image/*, .heic, .HEIC, .heif, .HEIF">
            <div id="uploadStatus" class="upload-status"></div>
            <div id="formImgPreview" class="preview-box"></div>
        </div>

        <div class="form-group">
            <label>上傳「音檔 ② 波形/頻譜截圖」（選擇性）</label>
            <input type="file" id="specImage" accept="image/*">
            <div id="specUploadStatus" class="upload-status"></div>
            <div id="specImgPreview" class="preview-box"></div>
        </div>

        <div class="form-group">
            <label>一、直覺收訊—宇宙源頭、你的高我、靈性幕後團隊</label>
            <textarea id="sec1" placeholder="輸入直覺收訊內容..."></textarea>
        </div>

        <div class="form-group">
            <label>二、象棋單卦資料</label>
            <textarea id="sec2" placeholder="輸入象棋單卦解析..."></textarea>
        </div>

        <div class="form-group">
            <label>三、塔羅資料</label>
            <textarea id="tarot1" placeholder="1）整體能量場（切牌）"></textarea>
            <textarea id="tarot2" placeholder="2）主牌 1 解析" style="margin-top: 6px;"></textarea>
            <textarea id="tarot3" placeholder="3）主牌 2 解析" style="margin-top: 6px;"></textarea>
            <textarea id="tarot4" placeholder="4）主牌 3 解析" style="margin-top: 6px;"></textarea>
            <textarea id="tarot5" placeholder="5）靈魂課題（底牌）" style="margin-top: 6px;"></textarea>
            <textarea id="tarot6" placeholder="6）總結（AI建議）" style="margin-top: 6px;"></textarea>
        </div>

        <div class="form-group">
            <label>四、神諭卡資料</label>
            <textarea id="sec4" placeholder="輸入神諭卡指引與建議..."></textarea>
        </div>

        <div class="form-group">
            <label>五、推薦療癒清理的資料</label>
            <textarea id="sec5" placeholder="輸入推薦清理的資料項目..." style="height: 100px;"></textarea>
        </div>

        <div class="form-group">
            <label>六、推薦下載的資料</label>
            <textarea id="sec6" placeholder="輸入推薦下載的資料項目..." style="height: 110px;"></textarea>
        </div>

        <button class="btn-main" style="margin-top:10px;" onclick="generateReport()">一鍵生成預覽報告</button>
    </div>

    <!-- 右側：報告預覽與下載面板 -->
    <div class="panel">
        <div class="report-preview-wrapper">
            <div id="reportOutput" class="report-preview">請在左側輸入資料，並點擊「一鍵生成預覽報告」。</div>
        </div>
        
        <div class="action-card">
            <div class="action-card-title">📜 報告與圖卡操作</div>
            <div class="btn-grid-2" style="margin-bottom: 10px;">
                <button class="btn-main btn-print" onclick="printMode()">🖨️ 另存 PDF / 列印</button>
                <button class="btn-main btn-copy" onclick="copyReport()">📋 複製報告內容</button>
            </div>
            <div class="btn-grid-2">
                <button class="btn-main btn-cards" onclick="generateAffirmationCards()">🖼️ 下載資料卡 (Zip)</button>
                <button class="btn-main btn-audio" onclick="generateAudioExplanationCard()">🌌 下載顯化音頻卡 (PNG)</button>
            </div>
        </div>
    </div>
</div>

<canvas id="card-canvas"></canvas>

<script>
document.getElementById('readDate').valueAsDate = new Date();

let uploadedImgDataUrl = "";
let uploadedSpecDataUrl = "";

const updatePageTitle = () => {
    const name = document.getElementById('clientName').value.trim() || "個案";
    document.title = `${name}的解讀和療癒建議 _ 凱特`;
};

function processHighResImage(rawImg) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = function() {
            const cvs = document.createElement('canvas');
            cvs.width = img.width;
            cvs.height = img.height;
            const ctx = cvs.getContext('2d');
            ctx.filter = "brightness(1.05) contrast(1.02)";
            ctx.drawImage(img, 0, 0);
            resolve(cvs.toDataURL('image/jpeg', 0.95));
        };
        img.src = rawImg;
    });
}

// 牌陣照片處理
document.getElementById('spreadImage').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    const status = document.getElementById('uploadStatus');
    const preview = document.getElementById('formImgPreview');
    if (!file) { uploadedImgDataUrl = ""; status.innerText = ""; preview.innerHTML = ""; return; }

    const fileName = file.name.toLowerCase();
    const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type.includes('heic') || file.type.includes('heif');
    status.innerText = isHeic ? "⌛ 正在解析 HEIC 照片..." : "⌛ 正在處理照片...";

    try {
        if (isHeic) {
            if (typeof heic2any === 'undefined') throw new Error('HEIC 轉碼引擎載入中...');
            const converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.95 });
            const targetBlob = Array.isArray(converted) ? converted[0] : converted;
            const reader = new FileReader();
            reader.onload = function(evt) {
                uploadedImgDataUrl = evt.target.result;
                status.innerText = "✓ 照片載入成功！";
                preview.innerHTML = `<img src="${uploadedImgDataUrl}" alt="預覽圖">`;
            };
            reader.readAsDataURL(targetBlob);
        } else {
            const reader = new FileReader();
            reader.onload = async function(evt) {
                uploadedImgDataUrl = await processHighResImage(evt.target.result);
                status.innerText = "✓ 照片載入成功！";
                preview.innerHTML = `<img src="${uploadedImgDataUrl}" alt="預覽圖">`;
            };
            reader.readAsDataURL(file);
        }
    } catch (err) {
        console.error(err);
        status.innerText = "❌ 照片解析失敗，請重新選擇。";
    }
});

// 頻譜圖上傳處理
document.getElementById('specImage').addEventListener('change', function(e) {
    const file = e.target.files[0];
    const status = document.getElementById('specUploadStatus');
    const preview = document.getElementById('specImgPreview');
    if (!file) { uploadedSpecDataUrl = ""; status.innerText = ""; preview.innerHTML = ""; return; }

    const reader = new FileReader();
    reader.onload = function(evt) {
        uploadedSpecDataUrl = evt.target.result;
        status.innerText = "✓ 頻譜截圖上傳成功！";
        preview.innerHTML = `<img src="${uploadedSpecDataUrl}" alt="頻譜預覽">`;
    };
    reader.readAsDataURL(file);
});

// 生成預覽報告
const generateReport = () => {
    updatePageTitle();
    const client = document.getElementById('clientName').value.trim() || '個案';
    const reader = document.getElementById('readerName').value.trim() || '凱特';
    const date = document.getElementById('readDate').value;
    const topic = document.getElementById('readTopic').value.trim();

    const sec1 = document.getElementById('sec1').value.trim();
    const sec2 = document.getElementById('sec2').value.trim();
    
    const t1 = document.getElementById('tarot1').value.trim();
    const t2 = document.getElementById('tarot2').value.trim();
    const t3 = document.getElementById('tarot3').value.trim();
    const t4 = document.getElementById('tarot4').value.trim();
    const t5 = document.getElementById('tarot5').value.trim();
    const t6 = document.getElementById('tarot6').value.trim();

    const sec4 = document.getElementById('sec4').value.trim();
    const sec5 = document.getElementById('sec5').value.trim();
    const sec6 = document.getElementById('sec6').value.trim();

    const headerHTML = `
        <div class="report-header-box">
            <h2>個案解讀和療癒建議</h2>
            <div class="report-meta">
                <span><strong>個案：</strong>${client}</span>
                ${topic ? `<span><strong>主題：</strong>${topic}</span>` : ''}
                <span><strong>日期：</strong>${date}</span>
                <span><strong>解讀者：</strong>${reader}</span>
            </div>
        </div>
    `;

    let imgHTML = '';
    if (uploadedImgDataUrl) {
        imgHTML = `
            <div class="top-image-section">
                <div class="top-image-title">✨ 牌陣與卦象</div>
                <img src="${uploadedImgDataUrl}" alt="牌陣照片">
            </div>
        `;
    }

    let tarotHTML = '';
    if (t1 || t2 || t3 || t4 || t5 || t6) {
        tarotHTML = `
            ${t1 ? `<strong>【整體能量場】</strong>\n${t1}\n\n` : ''}
            ${t2 ? `<strong>【核心議題一】</strong>\n${t2}\n\n` : ''}
            ${t3 ? `<strong>【核心議題二】</strong>\n${t3}\n\n` : ''}
            ${t4 ? `<strong>【核心議題三】</strong>\n${t4}\n\n` : ''}
            ${t5 ? `<strong>【靈魂課題】</strong>\n${t5}\n\n` : ''}
            ${t6 ? `<strong>【整合總結】</strong>\n${t6}` : ''}
        `.trim();
    }

    let html = `<div class="first-page-header-block">${headerHTML}${imgHTML}</div>`;

    if (sec1) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">一、直覺收訊—宇宙源頭、你的高我、靈性幕後團隊</div><div class="item-card">${sec1}</div></div></div>`;
    }
    if (sec2) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">二、象棋單卦資料</div><div class="item-card">${sec2}</div></div></div>`;
    }
    if (tarotHTML) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">三、塔羅資料</div><div class="item-card">${tarotHTML}</div></div></div>`;
    }
    if (sec4) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">四、神諭卡資料</div><div class="item-card">${sec4}</div></div></div>`;
    }
    if (sec5) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">五、推薦療癒清理的資料</div><div class="item-card">${sec5}</div></div></div>`;
    }
    if (sec6) {
        html += `<div class="report-section"><div class="section-header-block"><div class="section-title-bar">六、推薦下載的資料</div><div class="item-card">${sec6}</div></div></div>`;
    }

    // 第七項：療癒清理與下載資料（固定說明，文字依要求更新）
    html += `
        <div class="report-section">
            <div class="section-header-block">
                <div class="section-title-bar">七、療癒清理與下載資料</div>
                
                <div class="method-box">
                    <h3>療癒清理資料方法</h3>
                    <div class="method-section">
                        <strong>🧹 默唸【零極限】：</strong><br>
                        <strong>精簡版：</strong>對不起、請原諒我、謝謝你、我愛你<br>
                        <strong>完整版：</strong>對不起、請原諒過去的我不明白、才有這樣的資料，${client}（對方的名字、如果有他人的話）謝謝你、給我機會清理這個資料，我愛你。
                    </div>
                    <div class="method-section">
                        <strong>🧹 宣告一下：</strong><br>

const copyReport = () => {

    if (head) {
        L.push(`${head.querySelector('h2')?.innerText.trim()}\n`);
        head.querySelectorAll('.report-meta span').forEach(m => L.push(m.innerText.trim()));
        L.push('');
    }

    reportNode.querySelectorAll('.report-section').forEach(sec => {
        const t = sec.querySelector('.section-title-bar');
        if (t) L.push("----------------------------------------", `📌 ${t.innerText.trim()}`, "----------------------------------------");
        sec.querySelectorAll('.item-card').forEach(card => {
            L.push(card.innerText.trim());
            L.push('');
        });
    });

    reportNode.querySelectorAll('.method-box').forEach(box => {

        if (bt) L.push(bt.innerText.trim(), "----------------------------------------");

};

// 小卡打包生成
async function generateAffirmationCards() {
    const textRaw = document.getElementById('sec6').value.trim();
    if (!textRaw) {
        alert('請先在第六區塊「推薦下載的資料」輸入內容！');
        return;
    }

    const lines = textRaw.split('\n')
        .map(line => line.replace(/^[0-9\.\s、]+/g, '').replace(/[。]$/, '').trim())
        .filter(line => line.length > 0);

    if (lines.length === 0) {
        alert('未檢測到有效的語句');
        return;
    }

    const zip = new JSZip();
    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d');
    const clientName = document.getElementById('clientName').value.trim() || '個案';

    canvas.width = 1080;
    canvas.height = 1080;

    for (let i = 0; i < lines.length; i++) {
        const text = lines[i];

        const gradient = ctx.createLinearGradient(0, 0, 1080, 1080);
        gradient.addColorStop(0, '#faf6f0');
        gradient.addColorStop(0.6, '#f3e8df');
        gradient.addColorStop(1, '#e8ded2');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1080, 1080);

        ctx.strokeStyle = '#c49a6c';
        ctx.lineWidth = 3;
        ctx.strokeRect(60, 60, 960, 960);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(74, 74, 932, 932);

        ctx.font = '500 36px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#7a5c53';
        ctx.textAlign = 'center';
        ctx.fillText('資 料 下 載', 540, 220);

        ctx.font = '500 48px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#3d3531';
        
        const maxWidth = 760;
        const lineHeight = 76;
        const words = text.split('');
        let currentLine = '';
        let textLines = [];

        for (let n = 0; n < words.length; n++) {
            let testLine = currentLine + words[n];
            let metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && n > 0) {
                textLines.push(currentLine);
                currentLine = words[n];
            } else {
                currentLine = testLine;
            }
        }
        textLines.push(currentLine);

        let startY = 540 - ((textLines.length - 1) * lineHeight) / 2;
        for (let j = 0; j < textLines.length; j++) {
            ctx.fillText(textLines[j], 540, startY + (j * lineHeight));
        }

        ctx.font = '400 30px "Noto Sans TC", sans-serif';
        ctx.fillStyle = '#776860';
        ctx.fillText('謝謝你、我愛你', 540, 900);

        const dataUrl = canvas.toDataURL('image/png');
        zip.file(`資料下載卡片_${i + 1}.png`, dataUrl.replace(/^data:image\/png;base64,/, ""), {base64: true});
    }

    const listCardHeight = Math.max(1920, 450 + (lines.length * 60));
    canvas.width = 1080;
    canvas.height = listCardHeight;

    const bgGrad = ctx.createLinearGradient(0, 0, 1080, listCardHeight);
    bgGrad.addColorStop(0, '#faf6f0');
    bgGrad.addColorStop(0.5, '#f1ebf2');
    bgGrad.addColorStop(1, '#e5dad0');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, listCardHeight);

    ctx.strokeStyle = '#c49a6c';
    ctx.lineWidth = 3;
    ctx.strokeRect(50, 50, 980, listCardHeight - 100);

    ctx.font = '700 46px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#7a5c53';
    ctx.textAlign = 'center';
    ctx.fillText('資 料 下 載', 540, 150);

    ctx.font = '400 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#3d3531';
    ctx.textAlign = 'left';

    let listStartY = 230;
    lines.forEach((line, idx) => {
        let displayStr = `${idx + 1}. ${line}`;
        if (displayStr.length > 30) displayStr = displayStr.substring(0, 29) + '...';
        ctx.fillText(displayStr, 90, listStartY + (idx * 55));
    });

    ctx.font = '400 32px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#7a5c53';
    ctx.textAlign = 'center';
    ctx.fillText('謝謝你、我愛你', 540, listCardHeight - 100);

    const fullCardData = canvas.toDataURL('image/png');
    zip.file(`資料下載_全集總覽卡.png`, fullCardData.replace(/^data:image\/png;base64,/, ""), {base64: true});

    alert('正在為您打包生成質感圖卡包，請稍候...');
    zip.generateAsync({type:"blob"}).then(function(content) {
        saveAs(content, `${clientName}_資料下載圖卡套組.zip`);
    });
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split('');
    let line = '';
    let currY = y;

    for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n];
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, currY);
            line = words[n];
            currY += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, currY);
    return currY + lineHeight;
}

    insideY = wrapText(ctx, '💡 小提醒：由於手機內建的喇叭或一般的單耳藍牙耳機，在設計上會自動過濾掉人類聽覺邊緣的高頻聲音（通常只到15,000Hz以下），這可能會讓專屬的潛意識語音無法發揮最大功效。使用效能完整的耳機聆聽，最能完美接收這份豐盛的能量哦～', 120, insideY, 840, 29);

    insideY += 16;
    ctx.font = '400 21px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#3d3531';
    insideY = wrapText(ctx, '⚙️ 設定建議：播放時建議不要開啟「EQ音效等化器」或「高頻壓縮/省電模式」', 120, insideY, 840, 32);

    insideY += 12;
    insideY = wrapText(ctx, '🔊 音量與聆聽時機：音量保持適中舒適即可。非常適合於「清晨醒來」或「睡前閉眼」時聆聽，這兩個時段是大腦進入 Theta 波、顯化效果最強烈的黃金半小時', 120, insideY, 840, 32);

    curY += actualAudio2Height + 40;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.roundRect(80, curY, 920, actualListHeight, 18);
    ctx.fill();
    ctx.strokeStyle = '#ebdcd0';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = '700 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#7a5c53';
    ctx.fillText('✨ 音檔下載資料', 120, curY + 55);

    ctx.font = '400 22px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#3d3531';
    let lineY = curY + 110;

    for (let i = 0; i < lines.length; i++) {
        let displayStr = `${i + 1}. ${lines[i]}`;
        if (displayStr.length > 33) displayStr = displayStr.substring(0, 32) + '...';
        ctx.fillText(displayStr, 130, lineY);
        lineY += 52;
    }

    curY += actualListHeight + 65;

    ctx.textAlign = 'center';
    ctx.font = '500 30px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#7a5c53';
    ctx.fillText('「你所尋求的，也正尋求著你。」', 540, curY);

    ctx.font = '400 24px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#776860';
    ctx.fillText('願這道專屬頻率，陪伴你輕鬆豐盛地顯化理想生活', 540, curY + 45);

    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${clientName}_專屬量子頻率顯化音頻說明卡.png`;
    a.click();
}
</script>
