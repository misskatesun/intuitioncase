<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個案解讀和療癒建議 by 凱特</title>
  
  <!-- 引入第三方庫：JSZip, FileSaver, Noto Sans TC & HEIC 轉檔庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* Canva 風格 Pantone 極簡色系：柔紫 (Pantone 15-3817) & 暖沙金 (Pantone 13-1012) */
    :root {
      --pantone-purple: #614d75;
      --pantone-light-purple: #f1ecf5;
      --pantone-sand: #e0d4c5;
      --pantone-gold: #b38b43;
      --pantone-dark: #222023;
      --pantone-soft-gray: #636066;
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--pantone-dark);
      margin: 0;
      padding: 40px 20px;
      line-height: 1.95;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 55px 45px;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(97, 77, 117, 0.08);
      border: 1px solid rgba(224, 212, 197, 0.6);
    }

    h1.app-title {
      text-align: center;
      color: var(--pantone-purple);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 0;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid var(--pantone-sand);
    }

    .form-group {
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
      color: var(--pantone-purple);
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 16px 18px;
      border: 1.5px solid #dcd7ce;
      border-radius: 10px;
      font-family: inherit;
      font-size: 17px;
      background-color: #fdfdfd;
      color: var(--pantone-dark);
      transition: all 0.25s ease;
    }

    input[type="text"]:focus, input[type="date"]:focus, textarea:focus {
      outline: none;
      border-color: var(--pantone-purple);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(97, 77, 117, 0.12);
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 20px;
    }

    .row .form-group {
      flex: 1;
    }

    .upload-status {
      font-size: 15px;
      color: var(--pantone-purple);
      margin-top: 8px;
      font-weight: 500;
    }

    .preview-box {
      margin-top: 12px;
      text-align: center;
    }

    .preview-box img {
      max-width: 260px;
      max-height: 260px;
      border-radius: 8px;
      border: 1px solid var(--pantone-sand);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 40px;
    }

    .btn-row {
      display: flex;
      gap: 20px;
    }

    button {
      flex: 1;
      padding: 18px 24px;
      border: none;
      border-radius: 35px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .btn-pdf {
      background-color: var(--pantone-purple);
      color: white;
    }

    .btn-cards {
      background-color: var(--pantone-gold);
      color: white;
    }

    .btn-audio {
      background: linear-gradient(135deg, #614d75 0%, #8e72a8 100%);
      color: white;
      font-size: 19px;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.12);
    }

    /* ===== Canva 極簡風 PDF/列印樣式 ===== */
    #report-output {
      display: none;
      background: #ffffff;
      padding: 40px;
      color: var(--pantone-dark);
    }

    .report-header {
      text-align: center;
      padding-bottom: 15px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--pantone-sand);
      page-break-after: avoid;
      break-after: avoid;
    }

    .report-title {
      font-size: 32px;
      font-weight: 700;
      color: var(--pantone-purple);
      margin: 0 0 16px 0;
      letter-spacing: 3px;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      color: var(--pantone-soft-gray);
      background: var(--pantone-light-purple);
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 500;
    }

    /* 第一頁標題正下方的照片區塊，防斷頁處理 */
    .top-image-section {
      margin: 20px 0 28px 0;
      text-align: center;
      page-break-inside: avoid;
      page-break-after: avoid;
      break-after: avoid;
    }

    .top-image-section img {
      max-width: 100%;
      max-height: 380px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      border: 1px solid var(--pantone-sand);
    }

    .section-box {
      margin-bottom: 30px;
      padding: 26px 28px;
      background-color: #faf9f7;
      border-radius: 14px;
      border-left: 5px solid var(--pantone-gold);
      page-break-inside: avoid;
    }

    .section-title {
      font-size: 21px;
      color: var(--pantone-purple);
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .section-content {
      white-space: pre-line;
      line-height: 1.95;
      font-size: 18px;
      color: #2b292c;
    }

    #card-canvas {
      display: none;
    }

    /* 列印專用 CSS */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }
      .container {
        display: none !important;
      }
      #report-output {
        display: block !important;
        padding: 0;
      }
      @page {
        margin: 10mm;
        size: A4 portrait;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="app-title">個案解讀和療癒建議 by 凱特</h1>

  <form id="report-form">
    <div class="row">
      <div class="form-group">
        <label>個案姓名</label>
        <input type="text" id="clientName" placeholder="例如：小明" required>
      </div>
      <div class="form-group">
        <label>解讀者</label>
        <input type="text" id="readerName" value="凱特">
      </div>
      <div class="form-group">
        <label>解讀日期</label>
        <input type="date" id="readDate">
      </div>
    </div>

    <div class="form-group">
      <label>解讀主題</label>
      <input type="text" id="readTopic" placeholder="例如：近期事業發展與能量狀態對齊">
    </div>

    <div class="form-group">
      <label>上傳牌陣照片（支援 JPG, PNG, HEIC 格式）</label>
      <input type="file" id="spreadImage" accept="image/*, .heic, .HEIC, .heif, .HEIF">
      <div id="uploadStatus" class="upload-status"></div>
      <div id="formImgPreview" class="preview-box"></div>
    </div>

    <div class="form-group">
      <label>一、直覺收訊—宇宙源頭、你的高我、靈性幕後團隊</label>
      <textarea id="sec1" placeholder="輸入直覺收訊內容..."></textarea>
    </div>

    <div class="form-group">
      <label>二、象棋單卦資料</label>
      <textarea id="sec2" placeholder="輸入象棋單卦解析..."></textarea>
    </div>

    <div class="form-group">
      <label>三、塔羅資料</label>
      <textarea id="tarot1" placeholder="1）整體能量場（切牌）"></textarea>
      <textarea id="tarot2" placeholder="2）主牌 1 解析" style="margin-top: 10px;"></textarea>
      <textarea id="tarot3" placeholder="3）主牌 2 解析" style="margin-top: 10px;"></textarea>
      <textarea id="tarot4" placeholder="4）主牌 3 解析" style="margin-top: 10px;"></textarea>
      <textarea id="tarot5" placeholder="5）靈魂課題（底牌）" style="margin-top: 10px;"></textarea>
      <textarea id="tarot6" placeholder="6）總結（AI建議）" style="margin-top: 10px;"></textarea>
    </div>

    <div class="form-group">
      <label>四、神諭卡資料</label>
      <textarea id="sec4" placeholder="輸入神諭卡指引與建議..."></textarea>
    </div>

    <div class="form-group">
      <label>五、推薦療癒清理的資料</label>
      <textarea id="sec5" placeholder="輸入推薦清理的資料項目..." style="height: 140px;"></textarea>
    </div>

    <div class="form-group">
      <label>六、推薦下載的資料</label>
      <textarea id="sec6" placeholder="輸入推薦下載的資料項目..." style="height: 160px;"></textarea>
    </div>

    <div class="btn-group">
      <div class="btn-row">
        <button type="button" class="btn-pdf" onclick="generatePDF()">📄 下載 / 列印 PDF 報告</button>
        <button type="button" class="btn-cards" onclick="generateAffirmationCards()">🖼️ 下載資料下載圖卡 (Zip)</button>
      </div>
      <button type="button" class="btn-audio" onclick="generateAudioExplanationCard()">🌌 下載「專屬顯化音頻說明卡」 (PNG)</button>
    </div>
  </form>
</div>

<!-- PDF 列印與輸出區域 -->
<div id="report-output">
  <div class="report-header">
    <h1 class="report-title">個案解讀和療癒建議 by 凱特</h1>
    <div class="meta-info">
      <span id="out-client">個案：</span>
      <span id="out-topic">主題：</span>
      <span id="out-date">日期：</span>
      <span id="out-reader">解讀者：凱特</span>
    </div>
  </div>

  <!-- 強制鎖定在第一頁標題正下方的照片區塊 -->
  <div class="top-image-section" id="out-img-container"></div>

  <div class="section-box">
    <h2 class="section-title">一、直覺收訊—宇宙源頭、你的高我、靈性幕後團隊</h2>
    <div class="section-content" id="out-sec1"></div>
  </div>

  <div class="section-box">
    <h2 class="section-title">二、象棋單卦資料</h2>
    <div class="section-content" id="out-sec2"></div>
  </div>

  <div class="section-box">
    <h2 class="section-title">三、塔羅資料</h2>
    <div class="section-content">
      <strong>【整體能量場】</strong><br><span id="out-t1"></span><br><br>
      <strong>【核心議題一】</strong><br><span id="out-t2"></span><br><br>
      <strong>【核心議題二】</strong><br><span id="out-t3"></span><br><br>
      <strong>【核心議題三】</strong><br><span id="out-t4"></span><br><br>
      <strong>【靈魂課題】</strong><br><span id="out-t5"></span><br><br>
      <strong>【整合總結】</strong><br><span id="out-t6"></span>
    </div>
  </div>

  <div class="section-box">
    <h2 class="section-title">四、神諭卡資料</h2>
    <div class="section-content" id="out-sec4"></div>
  </div>

  <div class="section-box">
    <h2 class="section-title">五、推薦療癒清理的資料</h2>
    <div class="section-content" id="out-sec5"></div>
  </div>

  <div class="section-box">
    <h2 class="section-title">六、推薦下載的資料</h2>
    <div class="section-content" id="out-sec6"></div>
  </div>
</div>

<canvas id="card-canvas"></canvas>

<script>
  document.getElementById('readDate').valueAsDate = new Date();

  let uploadedImgDataUrl = "";
  const uploadStatus = document.getElementById('uploadStatus');
  const formImgPreview = document.getElementById('formImgPreview');

  // PNG/JPG 高畫質渲染與適度增亮處理器
  function processHighResImage(rawImg) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = function() {
        const cvs = document.createElement('canvas');
        cvs.width = img.width;
        cvs.height = img.height;
        const ctx = cvs.getContext('2d');
        ctx.filter = "brightness(1.35) contrast(1.08)";
        ctx.drawImage(img, 0, 0);
        resolve(cvs.toDataURL('image/jpeg', 0.95));
      };
      img.src = rawImg;
    });
  }

  document.getElementById('spreadImage').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) {
      uploadedImgDataUrl = "";
      uploadStatus.innerText = "";
      formImgPreview.innerHTML = "";
      return;
    }

    const fileName = file.name.toLowerCase();
    const isHeic = fileName.endsWith('.heic') || fileName.endsWith('.heif') || file.type.includes('heic') || file.type.includes('heif');

    uploadStatus.innerText = isHeic ? "⌛ 正在解析 HEIC 照片..." : "⌛ 正在處理高畫質照片...";

    try {
      if (isHeic) {
        if (typeof heic2any === 'undefined') {
          throw new Error('HEIC 轉碼引擎載入中，請重新選擇圖片。');
        }
        const converted = await heic2any({
          blob: file,
          toType: "image/jpeg",
          quality: 0.95
        });
        const targetBlob = Array.isArray(converted) ? converted[0] : converted;
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedImgDataUrl = evt.target.result;
          uploadStatus.innerText = "✓ HEIC 照片已成功載入並完成解析！";
          formImgPreview.innerHTML = `<img src="${uploadedImgDataUrl}" alt="預覽圖">`;
        };
        reader.readAsDataURL(targetBlob);
      } else {
        const reader = new FileReader();
        reader.onload = async function(evt) {
          uploadedImgDataUrl = await processHighResImage(evt.target.result);
          uploadStatus.innerText = "✓ 高畫質照片已成功載入並完成優化！";
          formImgPreview.innerHTML = `<img src="${uploadedImgDataUrl}" alt="預覽圖">`;
        };
        reader.readAsDataURL(file);
      }

    } catch (err) {
      console.error(err);
      uploadStatus.innerText = "❌ 照片解析失敗，請重新選擇照片。";
    }
  });

  // 1. 生成與列印 PDF 功能
  function generatePDF() {
    const clientName = document.getElementById('clientName').value.trim() || '個案';
    document.title = `${clientName}的解讀和療癒建議`;

    document.getElementById('out-client').innerText = '個案：' + clientName;
    document.getElementById('out-reader').innerText = '解讀者：' + (document.getElementById('readerName').value || '凱特');
    document.getElementById('out-date').innerText = '日期：' + document.getElementById('readDate').value;
    document.getElementById('out-topic').innerText = '主題：' + document.getElementById('readTopic').value;

    document.getElementById('out-sec1').innerText = document.getElementById('sec1').value;
    document.getElementById('out-sec2').innerText = document.getElementById('sec2').value;

    document.getElementById('out-t1').innerText = document.getElementById('tarot1').value;
    document.getElementById('out-t2').innerText = document.getElementById('tarot2').value;
    document.getElementById('out-t3').innerText = document.getElementById('tarot3').value;
    document.getElementById('out-t4').innerText = document.getElementById('tarot4').value;
    document.getElementById('out-t5').innerText = document.getElementById('tarot5').value;
    document.getElementById('out-t6').innerText = document.getElementById('tarot6').value;

    document.getElementById('out-sec4').innerText = document.getElementById('sec4').value;
    document.getElementById('out-sec5').innerText = document.getElementById('sec5').value;
    document.getElementById('out-sec6').innerText = document.getElementById('sec6').value;

    const imgContainer = document.getElementById('out-img-container');
    imgContainer.innerHTML = '';
    if (uploadedImgDataUrl) {
      const img = document.createElement('img');
      img.src = uploadedImgDataUrl;
      imgContainer.appendChild(img);
    }

    setTimeout(() => {
      window.print();
    }, 300);
  }

  // 2. Canva 極簡風小卡生成器
  async function generateAffirmationCards() {
    const textRaw = document.getElementById('sec6').value.trim();
    if (!textRaw) {
      alert('請先在第六區塊輸入下載資料！');
      return;
    }

    const lines = textRaw.split('\n')
      .map(line => line.replace(/^[0-9\.\s、]+/g, '').trim())
      .filter(line => line.length > 0);

    if (lines.length === 0) {
      alert('未檢測到有效的語句');
      return;
    }

    const zip = new JSZip();
    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d');
    const clientName = document.getElementById('clientName').value.trim() || '個案';

    canvas.width = 1080;
    canvas.height = 1080;

    for (let i = 0; i < lines.length; i++) {
      const text = lines[i];

      const gradient = ctx.createLinearGradient(0, 0, 1080, 1080);
      gradient.addColorStop(0, '#f9f7f5');
      gradient.addColorStop(0.6, '#f1ebf2');
      gradient.addColorStop(1, '#e8ded2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1080, 1080);

      ctx.strokeStyle = '#b38b43';
      ctx.lineWidth = 3;
      ctx.strokeRect(60, 60, 960, 960);
      ctx.lineWidth = 1.5;
      ctx.strokeRect(74, 74, 932, 932);

      ctx.font = '500 36px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#614d75';
      ctx.textAlign = 'center';
      ctx.fillText('資 料 下 載', 540, 220);

      ctx.font = '500 48px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#222023';
      
      const maxWidth = 760;
      const lineHeight = 76;
      const words = text.split('');
      let currentLine = '';
      let textLines = [];

      for (let n = 0; n < words.length; n++) {
        let testLine = currentLine + words[n];
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          textLines.push(currentLine);
          currentLine = words[n];
        } else {
          currentLine = testLine;
        }
      }
      textLines.push(currentLine);

      let startY = 540 - ((textLines.length - 1) * lineHeight) / 2;
      for (let j = 0; j < textLines.length; j++) {
        ctx.fillText(textLines[j], 540, startY + (j * lineHeight));
      }

      ctx.font = '400 30px "Noto Sans TC", sans-serif';
      ctx.fillStyle = '#636066';
      ctx.fillText('謝謝你、我愛你', 540, 900);

      const dataUrl = canvas.toDataURL('image/png');
      zip.file(`資料下載卡片_${i + 1}.png`, dataUrl.replace(/^data:image\/png;base64,/, ""), {base64: true});
    }

    canvas.width = 1080;
    canvas.height = 1920;

    const bgGrad = ctx.createLinearGradient(0, 0, 1080, 1920);
    bgGrad.addColorStop(0, '#fbf9f7');
    bgGrad.addColorStop(0.5, '#f2edf4');
    bgGrad.addColorStop(1, '#e5dad0');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 1920);

    ctx.strokeStyle = '#b38b43';
    ctx.lineWidth = 3;
    ctx.strokeRect(50, 50, 980, 1820);

    ctx.font = '700 46px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.textAlign = 'center';
    ctx.fillText('資 料 下 載', 540, 150);

    ctx.font = '400 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.textAlign = 'left';

    let listStartY = 230;
    const itemLineHeight = Math.min(62, 1500 / lines.length);

    lines.forEach((line, idx) => {
      let displayLine = `${idx + 1}. ${line}`;
      if (displayLine.length > 30) {
        displayLine = displayLine.substring(0, 29) + '...';
      }
      ctx.fillText(displayLine, 90, listStartY + (idx * itemLineHeight));
    });

    ctx.font = '400 32px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.textAlign = 'center';
    ctx.fillText('謝謝你、我愛你', 540, 1810);

    const fullCardData = canvas.toDataURL('image/png');
    zip.file(`資料下載_全集總覽卡.png`, fullCardData.replace(/^data:image\/png;base64,/, ""), {base64: true});

    alert('正在為您打包生成 Pantone 質感圖卡包，請稍候...');
    zip.generateAsync({type:"blob"}).then(function(content) {
      saveAs(content, `${clientName}_資料下載圖卡套組.zip`);
    });
  }

  // 3. 專屬顯化音頻說明卡生成器
  function generateAudioExplanationCard() {
    const clientName = document.getElementById('clientName').value.trim() || '個案';
    const textRaw = document.getElementById('sec6').value.trim();

    if (!textRaw) {
      alert('請先在第六區塊「推薦下載的資料」輸入內容！音頻說明卡需要列出這些語句。');
      return;
    }

    const lines = textRaw.split('\n')
      .map(line => line.replace(/^[0-9\.\s、]+/g, '').trim())
      .filter(line => line.length > 0);

    const canvas = document.getElementById('card-canvas');
    const ctx = canvas.getContext('2d');

    // 採用高畫質質感長圖尺寸 1080 x 2200
    canvas.width = 1080;
    canvas.height = 2200;

    // 1. 背景漸層
    const bgGrad = ctx.createLinearGradient(0, 0, 1080, 2200);
    bgGrad.addColorStop(0, '#f8f5f8');
    bgGrad.addColorStop(0.3, '#f2ebf5');
    bgGrad.addColorStop(0.7, '#ebdcd0');
    bgGrad.addColorStop(1, '#e2d2c3');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 2200);

    // 2. 邊框設計
    ctx.strokeStyle = '#b38b43';
    ctx.lineWidth = 3;
    ctx.strokeRect(40, 40, 1000, 2120);
    ctx.lineWidth = 1;
    ctx.strokeRect(52, 52, 976, 2096);

    // 3. 頁首標題
    ctx.textAlign = 'center';
    ctx.font = '700 42px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.fillText('專 屬 定 制 ： 量 子 頻 率 顯 化 音 頻', 540, 130);

    ctx.font = '500 28px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText(`Dear ${clientName}，這是為你量身打造的 15 分鐘專屬顯化音頻`, 540, 190);

    // 4. 第一區塊：錄製語句清單卡片
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    ctx.beginPath();
    ctx.roundRect(80, 240, 920, 480, 16);
    ctx.fill();
    ctx.strokeStyle = '#e0d4c5';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.font = '700 30px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.fillText('✨ 音頻內含專屬肯定句語音（17,500Hz 超音波刻錄）：', 110, 295);

    ctx.font = '400 25px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#2b292c';
    let lineY = 350;
    const maxShowLines = Math.min(lines.length, 6);
    for (let i = 0; i < maxShowLines; i++) {
      let displayStr = `${i + 1}. ${lines[i]}`;
      if (displayStr.length > 32) displayStr = displayStr.substring(0, 31) + '...';
      ctx.fillText(displayStr, 120, lineY);
      lineY += 52;
    }
    if (lines.length > 6) {
      ctx.fillStyle = '#636066';
      ctx.fillText(`... 以及其餘共 ${lines.length} 條專屬下載資料`, 120, lineY);
    }

    // 5. 第二區塊：科學與能量解密
    ctx.textAlign = 'left';
    ctx.font = '700 32px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.fillText('🧬 音頻科學與能量解密', 80, 780);

    // 432Hz
    ctx.font = '700 27px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#b38b43';
    ctx.fillText('🌌 1. 432Hz 宇宙療癒心弦', 80, 835);

    ctx.font = '400 24px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText('背景融入「宇宙數學密碼」432Hz 自然正弦波，能釋放深層壓力、', 80, 875);
    ctx.fillText('引導腦波進入 θ (Theta) 希塔波狀態，開啟潛意識深層大門。', 80, 915);

    // 17500Hz
    ctx.font = '700 27px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#b38b43';
    ctx.fillText('🗣️ 2. 17,500Hz 超音波潛意識調變（Silent Subliminal）', 80, 980);

    ctx.font = '400 24px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText('採用 Lowery 專利技術，將為你錄製的肯定句推移至 17,500Hz 極高頻，', 80, 1020);
    ctx.fillText('直接繞過大腦的「理性批判牆」，讓正向信念無阻礙寫入潛意識。', 80, 1060);

    // 6. 第三區塊：聆聽指南卡片
    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.beginPath();
    ctx.roundRect(80, 1120, 920, 780, 16);
    ctx.fill();
    ctx.strokeStyle = '#b38b43';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.font = '700 32px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.fillText('🎧 專屬聆聽指南', 120, 1180);

    // 設備建議
    ctx.font = '700 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText('📱 器材設備建議：', 120, 1235);
    ctx.font = '400 23px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#444';
    ctx.fillText('建議使用全罩式耳機、高音質耳機或細緻的家用音響聆聽。', 120, 1275);
    ctx.fillText('＊小提醒：手機內建喇叭可能過濾高頻。請確保音樂軟體未開啟', 120, 1315);
    ctx.fillText('「音效等化器 (EQ)」或「高頻壓縮/省電模式」，以保留完整訊號。', 120, 1355);

    // 音量
    ctx.font = '700 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText('🔊 音量設定：', 120, 1425);
    ctx.font = '400 23px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#444';
    ctx.fillText('調至舒適適中即可，雖然聽不見說話聲，高頻能量仍穩定運作中。', 120, 1465);

    // 時機
    ctx.font = '700 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#222023';
    ctx.fillText('🌙 最佳聆聽時機：', 120, 1535);
    ctx.font = '400 23px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#444';
    ctx.fillText('非常適合在每天「清晨剛醒來時」或「晚上臨睡前」閉眼聆聽，', 120, 1575);
    ctx.fillText('這兩個時段是大腦進入 Theta 波、顯化效果最好的黃金半小時。', 120, 1615);

    // 7. 結尾與簽名
    ctx.textAlign = 'center';
    ctx.font = '500 32px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#614d75';
    ctx.fillText('「你所尋求的，也正尋求著你。」', 540, 1970);

    ctx.font = '400 26px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#636066';
    ctx.fillText('願這道專屬頻率，陪伴你輕鬆豐盛地顯化理想生活。', 540, 2020);

    // 下載圖片
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `${clientName}_專屬量子頻率顯化音頻說明卡.png`;
    a.click();
  }
</script>
